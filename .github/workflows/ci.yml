name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod declares go 1.25 as its minimum: the client-go dependency
          # graph of the live mode only has patched x/net and x/text releases in
          # that line (GO-2026-4918/5026/5970 have no 1.23/1.24 backport).
          # GOTOOLCHAIN=local makes these steps use the toolchain this job
          # installs, validating the minimum go.mod declares; the default build
          # (local dev and releases) uses the patched toolchain the directive pins.
          go-version: "1.25.13"
          cache: true
      - run: go build ./...
        env:
          GOTOOLCHAIN: local
      - run: go vet ./...
        env:
          GOTOOLCHAIN: local
      - run: go test -race ./...
        env:
          GOTOOLCHAIN: local

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
        env:
          GOTOOLCHAIN: local

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # govulncheck reports the standard-library advisories of the toolchain
          # it runs on, so this job pins the toolchain itself, at the same
          # patched release go.mod's `toolchain` directive pins for the build.
          # Two families need it: the os fix for GO-2026-4602 (CVE-2026-27139,
          # in the 1.25 line from go1.25.8, no backport to 1.23/1.24) and the
          # html/template XSS and regexp-context fixes (GO-2026-4865/4980/4982/
          # 6091) that became reachable when the HTML report started calling
          # html/template; all four are fixed by go1.25.13 and have no 1.23/1.24
          # backport, which is why the build toolchain is pinned too. The live
          # mode adds the x/net and x/text fixes the HTTPS transport makes
          # reachable (GO-2026-4918/5026/5970), also without a 1.23/1.24 backport.
          go-version: "1.25.13"
      # Pinned on purpose: an unversioned @latest broke this job once, when a
      # new release raised its own toolchain requirement (commit 954caa6).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
