name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # govulncheck reports the standard-library advisories of the toolchain
          # it runs on, so this job pins the toolchain itself: the os fix for
          # GO-2026-4602 (CVE-2026-27139) is available in the 1.25 line from
          # go1.25.8 on and has no backport to the 1.23 or 1.24 lines. The other
          # jobs keep building and testing on go 1.23, the minimum go.mod
          # declares: those checks validate compatibility, not the absence of
          # vulnerabilities in the Go 1.23 standard library.
          go-version: "1.25.8"
      # Pinned on purpose: an unversioned @latest broke this job once, when a
      # new release raised its own toolchain requirement (commit 954caa6).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
