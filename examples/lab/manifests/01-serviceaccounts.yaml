# Lab service accounts. Two application origins in lab-app, one in lab-dev, and
# a benign account that reaches nothing. The system identity that acts only as
# an intermediate lives in kube-system (see 04-system-identity.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: lab-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-admin
  namespace: lab-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: lab-dev
---
# Holds only a ConfigMap reader Role (03-rbac-namespaced.yaml): no catalog hop
# applies, so it must never appear as a source of a path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idle
  namespace: lab-dev
